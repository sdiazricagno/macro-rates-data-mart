version: 2

models:
  - name: stg_fred__dgs3mo
    description: >
      Typed DGS3MO observations from the committed fredgraph snapshot.
      Market Yield on U.S. Treasury Securities at 3-Month Constant Maturity, Quoted on an Investment Basis. measure_value is null on a missing print.
    columns:
      - name: observation_date
        description: Date published by FRED for this observation.
        data_tests:
          - not_null
          - unique
      - name: series_id
        description: FRED series id.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["DGS3MO"]
      - name: measure_name
        description: Column name used downstream.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["yield_3m"]
      - name: measure_value
        description: Observation in percent. Null when FRED has no print.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -1
                max_value: 25
      - name: unit
        description: Unit of measure_value.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["percent"]
      - name: frequency
        description: Native publication frequency.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["daily"]
      - name: seasonal_adjustment
        description: FRED seasonal-adjustment status.
        data_tests:
          - not_null

